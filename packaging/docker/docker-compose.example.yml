# Example for a one-port install: the UI at / and the API at /backend, on port 18789.
# Copy what you need. Secrets stay in an env file, never in this file.
# From the repo root:
#   docker compose -f packaging/docker/docker-compose.example.yml up --build
# This file does not push an image.

name: agent-office

services:
  office:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    image: agent-office:local
    env_file:
      - path: ../../.env
        required: false
    environment:
      NODE_ENV: production
      AO_ENV: production
      AO_DATA_DIR: /data
      AO_CONFIG: /config/config.json
      HOST: 0.0.0.0
      PORT: "18789"
    volumes:
      - ao-data:/data
      - ao-config:/config
    ports:
      - "127.0.0.1:18789:18789"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Same probe as the image HEALTHCHECK (docs/architecture/operations.md §1).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const p=process.env.PORT||18789;const urls=['/healthz','/backend/healthz'];(async()=>{for(const u of urls){try{const r=await fetch('http://127.0.0.1:'+p+u);if(r.ok)process.exit(0)}catch{}}process.exit(1)})()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Optional Traefik. Uncomment the labels and the proxy network when Traefik
    # already routes this host. Do not compress text/event-stream: the live
    # stream is /backend/api/v2/stream. Readiness is GET /readyz (operations.md §1).
    # networks: [default, proxy]
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=proxy
    #   - traefik.http.routers.agent-office.rule=Host(`office.example.com`)
    #   - traefik.http.routers.agent-office.entrypoints=websecure
    #   - traefik.http.routers.agent-office.tls=true
    #   - traefik.http.services.agent-office.loadbalancer.server.port=18789
    #   - traefik.http.services.agent-office.loadbalancer.healthcheck.path=/readyz
    #   - traefik.http.services.agent-office.loadbalancer.healthcheck.interval=15s
    #   - traefik.http.services.agent-office.loadbalancer.healthcheck.timeout=3s

volumes:
  ao-data: {}
  ao-config: {}

