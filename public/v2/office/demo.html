<!doctype html>
<html lang="fr-CA" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bureau · démo de la scène</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600&display=swap">
  <!-- Bureau CSS is injected by demo.js (dev path or config.assetBase, see README.md). -->
  <link rel="stylesheet" href="./office.css">
  <link rel="stylesheet" href="./editor.css">
  <!-- Vendored Preact + htm (frontend's public/v2/vendor), relative so it works from /public/v2/office/ and /v2/office/. -->
  <script type="importmap">
  { "imports": { "preact": "../vendor/preact.mjs", "preact/hooks": "../vendor/preact-hooks.mjs", "htm": "../vendor/htm.mjs" } }
  </script>
  <style>
    body { margin: 0; background: var(--bu-bg); color: var(--bu-text-primary); font: var(--bu-type-body, 14px/1.5 Inter, sans-serif); }
    .demo { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--bu-space-4, 16px); padding: var(--bu-space-4, 16px); min-height: 100vh; box-sizing: border-box; }
    .demo h1 { font: var(--bu-type-title, 600 20px/1.3 Sora, sans-serif); margin: 0 0 var(--bu-space-3, 12px); }
    .demo__stage { height: calc(100vh - 80px); min-height: 420px; }
    .demo__side { display: flex; flex-direction: column; gap: var(--bu-space-4, 16px); overflow: auto; max-height: calc(100vh - 32px); }
    .demo__panel { background: var(--bu-surface-raised); border: 1px solid var(--bu-border-subtle); border-radius: var(--bu-radius-card, 12px); padding: var(--bu-space-3, 12px); }
    .demo__panel h2 { font: var(--bu-type-heading, 600 15px/1.3 Inter, sans-serif); margin: 0 0 var(--bu-space-2, 8px); }
    .demo__row { display: grid; grid-template-columns: 1fr auto auto; gap: var(--bu-space-2, 8px); align-items: center; padding: var(--bu-space-2, 8px) 0; border-top: 1px solid var(--bu-border-subtle); }
    .demo__row:first-of-type { border-top: 0; }
    .demo__row[aria-current="true"] .demo__name { color: var(--bu-accent-text); }
    .demo__name { font-weight: 600; display: flex; gap: 6px; align-items: center; }
    .demo__row select { grid-column: 1 / -1; }
    .demo select, .demo input[type=checkbox] { font: inherit; color: inherit; }
    .demo select { background: var(--bu-surface-sunken, var(--bu-bg-sunken)); border: 1px solid var(--bu-border-default); border-radius: var(--bu-radius-control, 8px); padding: 6px 8px; }
    .demo__seg { display: flex; gap: 4px; flex-wrap: wrap; }
    .demo__seg .bu-btn[aria-pressed="true"] { background: var(--bu-accent); border-color: var(--bu-accent); color: var(--bu-text-on-accent); }
    .demo__meta { color: var(--bu-text-secondary); font: var(--bu-type-caption, 12px/1.4 Inter, sans-serif); margin: var(--bu-space-2, 8px) 0 0; }
    .demo__drawer { color: var(--bu-text-secondary); }
    .demo__drawer strong { color: var(--bu-text-primary); }
    .demo [hidden] { display: none !important; }
    .demo__editbar:empty { display: none; }
    .demo__editbar { margin-bottom: var(--bu-space-3, 12px); }
    .demo__editaside { max-height: calc(100vh - 32px); overflow: auto; }
    .demo__toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 1000; }
    .demo__editdemo { margin-top: 8px; }
    @media (max-width: 820px) { .demo { grid-template-columns: minmax(0, 1fr); } .demo__stage { height: 60vh; } .demo__side { max-height: none; } }
  </style>
</head>
<body>
  <main class="demo">
    <section aria-labelledby="demo-title">
      <h1 id="demo-title">Bureau · démo de la scène</h1>
      <div id="editbar" class="demo__editbar"></div>
      <div id="stage" class="bu-stage demo__stage"></div>
      <p class="demo__meta demo__editdemo" id="editdemo" hidden>Démo : <button type="button" class="bu-btn bu-btn--sm" id="external">Simuler un enregistrement sur un autre appareil</button> (le prochain « Enregistrer » reçoit un conflit 409).</p>
    </section>
    <aside class="demo__side demo__editaside" id="editaside" aria-label="Personnaliser" hidden></aside>
    <aside class="demo__side" id="demoside" aria-label="Contrôles de la démo">
      <div class="demo__panel">
        <h2>Thème du bureau</h2>
        <div class="demo__seg" role="group" aria-label="Thème du bureau" id="theme">
          <button type="button" class="bu-btn bu-btn--sm" data-theme-mode="auto">Automatique</button>
          <button type="button" class="bu-btn bu-btn--sm" data-theme-mode="day">Jour</button>
          <button type="button" class="bu-btn bu-btn--sm" data-theme-mode="night">Nuit</button>
        </div>
        <p class="demo__meta" id="theme-meta"></p>
        <label class="demo__meta"><input type="checkbox" id="reduced"> Réduire les animations (force <code>prefers-reduced-motion</code>)</label>
        <label class="demo__meta"><input type="checkbox" id="landmarks"> Afficher les repères de tête (débogage)</label>
        <label class="demo__meta"><input type="checkbox" id="legacy" checked> Accessoires v1 en attendant le lot 5b (anciennes surcouches)</label>
        <p class="demo__meta"><button type="button" class="bu-btn bu-btn--sm" id="ui-theme">Interface : sombre / clair</button></p>
      </div>
      <div class="demo__panel">
        <h2>Agents</h2>
        <div id="roster" role="list"></div>
        <p style="display:flex; gap:8px; flex-wrap:wrap; margin: 12px 0 0;">
          <button type="button" class="bu-btn bu-btn--sm" id="add">Ajouter un sous-agent</button>
          <button type="button" class="bu-btn bu-btn--sm" id="delegate">L’agent principal délègue</button>
          <button type="button" class="bu-btn bu-btn--sm" id="tour">Tous les états</button>
        </p>
      </div>
      <div class="demo__panel demo__drawer" id="drawer" aria-live="polite">
        <h2>Agent sélectionné</h2>
        <p>Cliquez une plaque (ou Tab puis Entrée) pour ouvrir le tiroir de l'agent.</p>
      </div>
    </aside>
  </main>
  <div class="bu-toasts demo__toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="./demo.js"></script>
</body>
</html>
